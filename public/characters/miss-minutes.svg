<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Glow / TVA Aura -->
  <defs>
    <radialGradient id="tvaOrange" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFA834"/>
      <stop offset="60%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D95300"/>
    </radialGradient>
    <radialGradient id="clockFace" cx="45%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FFE6B0"/>
      <stop offset="85%" stop-color="#FDC870"/>
      <stop offset="100%" stop-color="#E8A33A"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF7A00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Animated Outer Rim -->
  <circle cx="100" cy="95" r="72" fill="url(#tvaOrange)" stroke="#4A1E00" stroke-width="4.5" filter="url(#dropShadow)"/>

  <!-- Clock Ticks around the rim -->
  <circle cx="100" cy="95" r="63" stroke="#8C3A00" stroke-width="2" stroke-dasharray="2 10.5" fill="none"/>

  <!-- Inner Face -->
  <circle cx="100" cy="95" r="58" fill="url(#clockFace)" stroke="#7A3000" stroke-width="3"/>

  <!-- Clock Hands (Hair/Antennas of Clock) -->
  <!-- Hour hand pointing up-left -->
  <line x1="100" y1="95" x2="68" y2="70" stroke="#3A1200" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Minute hand pointing up-right -->
  <line x1="100" y1="95" x2="135" y2="58" stroke="#3A1200" stroke-width="4" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="100" cy="95" r="5" fill="#3A1200"/>

  <!-- Big Expressive Cartoon Eyes (Loki TVA Style) -->
  <!-- Left Eye -->
  <ellipse cx="80" cy="80" rx="14" ry="18" fill="#FFFFFF" stroke="#3A1200" stroke-width="3"/>
  <ellipse cx="82" cy="80" rx="8" ry="12" fill="#3A1200"/>
  <circle cx="79" cy="74" r="3.5" fill="#FFFFFF"/>
  <circle cx="84" cy="84" r="1.5" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="120" cy="80" rx="14" ry="18" fill="#FFFFFF" stroke="#3A1200" stroke-width="3"/>
  <ellipse cx="118" cy="80" rx="8" ry="12" fill="#3A1200"/>
  <circle cx="115" cy="74" r="3.5" fill="#FFFFFF"/>
  <circle cx="120" cy="84" r="1.5" fill="#FFFFFF"/>

  <!-- Eyelashes / Feminine Curve -->
  <path d="M 68 68 Q 63 60 60 62" stroke="#3A1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 72 65 Q 70 56 68 57" stroke="#3A1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 132 68 Q 137 60 140 62" stroke="#3A1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 128 65 Q 130 56 132 57" stroke="#3A1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cheerful Rosy Cheeks -->
  <ellipse cx="68" cy="104" rx="8" ry="5" fill="#FF5E36" opacity="0.6"/>
  <ellipse cx="132" cy="104" rx="8" ry="5" fill="#FF5E36" opacity="0.6"/>

  <!-- Big Iconic Open Smile -->
  <path d="M 74 100 Q 100 132 126 100 Z" fill="#8B0000" stroke="#3A1200" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pink Tongue -->
  <path d="M 85 116 Q 100 108 115 116 Q 100 128 85 116 Z" fill="#FF6B8B"/>

  <!-- Upper White Teeth Line -->
  <path d="M 76 101 Q 100 110 124 101" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>

  <!-- White Cartoon Glove (Right Hand waving) -->
  <g transform="translate(145, 95) rotate(15)">
    <path d="M 5 0 C 18 -10, 28 -5, 30 10 C 31 22, 22 28, 12 24 C 6 22, 2 12, 5 0 Z" fill="#FFFFFF" stroke="#3A1200" stroke-width="2.5"/>
    <path d="M 18 -2 C 22 -6, 26 -4, 26 2" stroke="#3A1200" stroke-width="2" fill="none"/>
    <circle cx="16" cy="12" r="1.5" fill="#3A1200"/>
    <circle cx="21" cy="11" r="1.5" fill="#3A1200"/>
    <!-- Glove cuff -->
    <rect x="-2" y="14" width="16" height="8" rx="4" fill="#FFFFFF" stroke="#3A1200" stroke-width="2.5"/>
  </g>

  <!-- White Cartoon Glove (Left Hand resting on hip) -->
  <g transform="translate(30, 110) rotate(-20)">
    <path d="M 12 0 C 2 8, -4 18, 2 24 C 8 28, 18 24, 20 12 C 20 4, 18 -2, 12 0 Z" fill="#FFFFFF" stroke="#3A1200" stroke-width="2.5"/>
    <rect x="8" y="2" width="14" height="7" rx="3.5" fill="#FFFFFF" stroke="#3A1200" stroke-width="2" transform="rotate(-15)"/>
  </g>

  <!-- Retro Cartoon Shoes (Feet) -->
  <ellipse cx="80" cy="172" rx="14" ry="7" fill="#8C3A00" stroke="#3A1200" stroke-width="2.5"/>
  <ellipse cx="120" cy="172" rx="14" ry="7" fill="#8C3A00" stroke="#3A1200" stroke-width="2.5"/>
  <!-- Little Stick Legs -->
  <line x1="82" y1="162" x2="82" y2="170" stroke="#3A1200" stroke-width="4" stroke-linecap="round"/>
  <line x1="118" y1="162" x2="118" y2="170" stroke="#3A1200" stroke-width="4" stroke-linecap="round"/>
</svg>
